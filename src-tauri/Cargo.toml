[package]
name = "morim"
version = "0.1.0"
description = "Morim - Open Source offline Kahoot alternative"
authors = ["HonoravelMacho"]
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macros"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression"] }
tower = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
qr_code = "0.5"
uuid = { version = "1.8", features = ["v4", "serde"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
tungstenite = "0.23"
local-ip-address = "0.2"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.19"
parking_lot = "0.12"